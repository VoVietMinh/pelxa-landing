# =========================================================================
# Pelxa — Production stack (Blue / Green)  —  HOST NGINX VARIANT
#
# This compose file ONLY runs the app. nginx is installed natively on the
# host (apt install nginx) — see deploy/nginx-host/*.conf.
#
#   pelxa_blue   → 127.0.0.1:5001 → container :3000   (default = active)
#   pelxa_green  → 127.0.0.1:5002 → container :3000   (profile-gated)
#
# Both ports bind to 127.0.0.1 only, so they are NOT reachable from the
# public internet — only the host nginx (which runs in the same network
# namespace) can connect to them. Public traffic enters via nginx :80.
#
# Deploy flow (deploy/scripts/deploy.sh):
#   1. Pull git, build new image
#   2. Bring up the standby color on its port
#   3. Wait for /healthz to go green
#   4. Atomically rewrite /etc/nginx/conf.d/01-pelxa-upstream.conf
#   5. nginx -s reload  (graceful — zero downtime)
#   6. Stop old color
# =========================================================================
services:
  pelxa_blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: pelxa-app:latest
    container_name: pelxa_blue
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      INSTANCE: blue
    ports:
      - "127.0.0.1:5001:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  pelxa_green:
    image: pelxa-app:latest
    container_name: pelxa_green
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      INSTANCE: green
    ports:
      - "127.0.0.1:5002:3000"
    profiles: ["green"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
