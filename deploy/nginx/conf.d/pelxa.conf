# =========================================================================
# Pelxa public server blocks
#
# Setup: Cloudflare in "Flexible" SSL mode.
#   - Visitor ↔ Cloudflare      → HTTPS (Cloudflare cert)
#   - Cloudflare ↔ origin (us)  → HTTP on :80
#
# `pelxa_active` upstream is defined in /etc/nginx/active/upstream.conf
# and points to either pelxa_blue:3000 or pelxa_green:3000 — swapped by
# the deploy script.
# =========================================================================

# www.pelxa.com → pelxa.com (canonical 301)
server {
    listen 80;
    server_name www.pelxa.com;
    # Cloudflare sets X-Forwarded-Proto so the browser ends up on https://
    return 301 https://pelxa.com$request_uri;
}

# Main server — pelxa.com (and any unknown host hitting this origin via CF)
server {
    listen 80 default_server;
    server_name pelxa.com _;

    # Drop slow / abusive clients fast
    client_max_body_size 2m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ----------------------------------------------------------------------
    # Long-cache static assets (Tailwind output, images, brand SVG/PNG)
    # ----------------------------------------------------------------------
    location ~* ^/(assets|css|js)/ {
        proxy_pass http://pelxa_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Ray            $http_cf_ray;
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;

        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ----------------------------------------------------------------------
    # Application
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://pelxa_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Ray            $http_cf_ray;
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;

        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # Critical for zero-downtime: if the active container disappears
        # mid-request, retry on the next upstream member.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ----------------------------------------------------------------------
    # Health (used by host-side monitoring + Cloudflare health checks)
    # ----------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://pelxa_active/healthz;
        access_log off;
    }
}
