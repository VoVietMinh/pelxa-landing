# =========================================================================
# Active upstream — DO NOT EDIT BY HAND.
# This file is rewritten atomically by deploy/scripts/deploy.sh on each
# blue/green switch.
#
# Lives at /etc/nginx/conf.d/01-pelxa-upstream.conf — must load before
# 10-pelxa.conf (the server blocks reference this upstream).
# =========================================================================
upstream pelxa_active {
    server 127.0.0.1:5001 max_fails=2 fail_timeout=5s;
    keepalive 16;
}
