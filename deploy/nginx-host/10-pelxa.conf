# =========================================================================
# Pelxa — host nginx server blocks
#
# Lives at /etc/nginx/conf.d/10-pelxa.conf
#
# Stack:
#   internet ──► Cloudflare ──► host nginx :80 ──► 127.0.0.1:<active port>
#                                                  └─► docker container pelxa_blue|green
#
# Cloudflare runs in Flexible mode → traffic from Cloudflare to origin is
# plain HTTP. Real visitor IP is restored by 00-cloudflare-realip.conf.
# =========================================================================

# www.pelxa.com → pelxa.com (canonical 301)
server {
    listen 80;
    server_name www.pelxa.com;
    return 301 https://pelxa.com$request_uri;
}

# Main server — pelxa.com
server {
    listen 80 default_server;
    server_name pelxa.com _;

    # Drop slow / abusive clients fast
    client_max_body_size 2m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ----------------------------------------------------------------------
    # Long-cache static assets (Tailwind output, images, brand SVG/PNG)
    # ----------------------------------------------------------------------
    location ~* ^/(assets|css|js)/ {
        proxy_pass http://pelxa_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Ray            $http_cf_ray;
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;

        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ----------------------------------------------------------------------
    # Application
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://pelxa_active;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Ray            $http_cf_ray;
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;

        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # Critical for zero-downtime: if the active container disappears
        # mid-request, retry on the next upstream member.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ----------------------------------------------------------------------
    # Health (used by host monitoring + Cloudflare health checks)
    # ----------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://pelxa_active/healthz;
        access_log off;
    }
}
